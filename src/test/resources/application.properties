spring.application.name=PN-IO-CONNECTOR-MOCK

# Runtime mode
pn.env.runtime=DEVELOPMENT

# AWS specific configurations
aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566

pn.log.trace-id-header=X-Amzn-Trace-Id

# SSM parameter names
pn.ioconnectormock.mock-sequence-parameter-names=MapIoConnectorMockSequence
pn.ioconnectormock.sender-not-allowed-parameter-name=MapIoConnectorMockSenderNotAllowed
pn.ioconnectormock.ssm-cache-ttl=PT5M